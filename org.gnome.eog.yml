id: org.gnome.eog
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: eog
rename-appdata-file: org.gnome.eog.metainfo.xml
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # We want full fs access so we can read the files
  - --filesystem=host
  # Migrate old dconf settings
  - --metadata=X-DConf=migrate-path=/org/gnome/eog/
  # GVFS access
  - --talk-name=org.gtk.vfs.*
  - --filesystem=xdg-run/gvfsd
cleanup:
  - /include
  - /lib/pkgconfig
  - /libexec
  - /share/gir-1.0
  - /share/man
  - /share/vala
  - '*.la'
  - '*.a'
modules:

  # Required by the EOG. The runtime no longer provides this module.
  - name: libhandy
    buildsystem: meson
    config-opts:
      - -Dglade_catalog=disabled
      - -Dvapi=true
      - -Dtests=false
      - -Dexamples=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libhandy/1.8/libhandy-1.8.3.tar.xz
        sha256: 05b497229073ff557f10b326e074c5066f8743a302d4820ab97bcb5cd2dab087

  - name: gnome-desktop
    buildsystem: meson
    config-opts:
      - -Ddesktop_docs=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gnome-desktop/51/gnome-desktop-51.0.tar.xz
        sha256: 9ebeb9f1769d3c310caeadd921ab34c8f264b92937740518b3bc859a579a6912
        x-checker-data:
          type: gnome
          name: gnome-desktop

  - name: libpeas
    buildsystem: meson
    config-opts:
      - -Dglade_catalog=false
      - -Ddemos=false
    cleanup: [/lib/peas-demo]
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libpeas/1.38/libpeas-1.38.1.tar.xz
        sha256: e82fd328adcac1aba34b64136bdfcbbacf2b3258a8bc4e5f480a72502a611ae9
        x-checker-data:
          type: gnome
          name: libpeas
          versions:
            <: 1.99.0

  - name: exempi
    cleanup: [/bin]
    rm-configure: true
    config-opts:
      - --disable-unittest
      - --disable-static
    sources:
      - type: archive
        url: https://libopenraw.freedesktop.org/download/exempi-2.6.6.tar.bz2
        sha256: 7513b7e42c3bd90a58d77d938c60d2e87c68f81646e7cb8b12d71fe334391c6f
        x-checker-data:
          type: anitya
          project-id: 767
          url-template: https://libopenraw.freedesktop.org/download/exempi-$version.tar.bz2
      - type: script
        commands:
          - autoreconf -vfi

  - name: eog
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/eog/50/eog-50.4.tar.xz
        sha256: db9a11ebad2fb1e5199c529d0eab8e566bd2d5138585ac467e5f6752206486c9
        x-checker-data:
          type: gnome
          name: eog
          is-important: true

  - name: eog-plugins
    buildsystem: meson
    config-opts:
      - -Dplugin_map=false
      - -Dplugin_postasa=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/eog-plugins/44/eog-plugins-44.1.tar.xz
        sha256: c4c384155fabb34889d76b616065483f94c8310fa0147236d009c68cd4a85c93
        x-checker-data:
          type: gnome
          name: eog-plugins
